# .github/workflows/carl-merge.yml in the adopting repository.
#
# The job checks out the default branch only and never runs a pull request's
# code. It fetches pull request heads as objects for `git diff`. That is what
# makes `pull_request_target` safe here.
#
# A label added by another workflow's own job token starts no run. If a
# workflow applies the ready label, list it under `workflow_run` as well.
name: Carl Mergé
on:
  pull_request_target:
    types: [labeled]
  workflow_run:
    workflows: [CI]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: carl-merge
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  merge:
    # A `workflow_run` trigger starts this job for every completed run, even
    # one whose own jobs were all skipped, and each start is a billed minute.
    # Run only when the triggering run succeeded, or when it was a CI run on
    # the base branch (any event in `base_events`, which by default is every
    # event but pull requests), so a red base still gets its comments. Rename
    # `CI` to your `ci_workflow`'s `name:`, and match `base_events` if you
    # narrowed it (docs/guide.md, section 2).
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success' ||
      (github.event.workflow_run.name == 'CI' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.event != 'pull_request_target')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CARL_MERGE_CLIENT_ID }}
          private-key: ${{ secrets.CARL_MERGE_PRIVATE_KEY }}
      - name: "Run one pass"
        env:
          CARL_MERGE_TOKEN: ${{ steps.token.outputs.token }}
          CARL_MERGE_APP_SLUG: ${{ steps.token.outputs.app-slug }}
          PYTHONPATH: vendor/carl_merge-0.2.1-py3-none-any.whl
        run: python3 -m carl_merge run --config .github/carl-merge.toml
