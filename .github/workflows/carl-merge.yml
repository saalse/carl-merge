# Carl Mergé merges this repository's own pull requests, from the released
# wheel in vendor/, not from the code under review.
#
# The job checks out the default branch only and never runs a pull request's
# code. It fetches pull request heads as objects for `git diff`. That is what
# makes `pull_request_target` safe here.
name: Carl Mergé
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] runs main's code only
    types: [labeled]
  workflow_run: # zizmor: ignore[dangerous-triggers] runs main's code only
    workflows: [CI]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: carl-merge
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false # the repository is public; git only reads
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CARL_MERGE_CLIENT_ID }}
          private-key: ${{ secrets.CARL_MERGE_PRIVATE_KEY }}
          # Only what the bot uses (docs/guide.md, section 3), not everything
          # the installation holds.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-actions: write
          permission-checks: read
          permission-statuses: read
          permission-workflows: write
      - name: "Run one pass"
        env:
          CARL_MERGE_TOKEN: ${{ steps.token.outputs.token }}
          CARL_MERGE_APP_SLUG: ${{ steps.token.outputs.app-slug }}
          PYTHONPATH: vendor/carl_merge-0.1.1-py3-none-any.whl
        run: python3 -m carl_merge run --config .github/carl-merge.toml
