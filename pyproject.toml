[project]
name = "carl-merge"
version = "0.1.1"
description = "A merge bot for repositories where several AI coding agents open pull requests in parallel: it bypass-merges a behind pull request when main changed nothing it touches, so CI is not rerun for nothing."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "merge-bot",
    "github-app",
    "pull-requests",
    "continuous-integration",
    "merge-queue",
    "ai-agents",
    "coding-agents",
    "github-actions",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.urls]
Source = "https://github.com/saalse/carl-merge"
Documentation = "https://github.com/saalse/carl-merge/blob/main/docs/guide.md"
Issues = "https://github.com/saalse/carl-merge/issues"

[project.scripts]
carl-merge = "carl_merge.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit: fast example-based tests (default)"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "DTZ", "SIM", "RUF"]
